name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The local-validator end-to-end path (npm run validator, provision:local,
      # e2e:local) is not run here: it needs the Solana CLI and a program dump
      # from devnet. Run it locally before releases (see CONTRIBUTING.md).
